name: BoticonWallpaper
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  BoticonWallpaper:
    type: application
    platform: iOS
    sources:
      - path: iOS/Boticon
        excludes: [Resources]
      - path: Sources/BoticonCore
      - path: iOS/Boticon/Resources/Shortcuts
        type: folder
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Boticon壁紙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.boticon.shortcut
            CFBundleURLSchemes: [boticon]
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 選択した壁紙を写真に保存して、写真シャッフルで使います。
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.boticon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_STRICT_CONCURRENCY: complete
  BoticonWallpaperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/UITests
    dependencies:
      - target: BoticonWallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.boticon.uitests
        TEST_TARGET_NAME: BoticonWallpaper
    info:
      path: iOS/UITests/Info.plist
schemes:
  BoticonWallpaper:
    build:
      targets:
        BoticonWallpaper: all
        BoticonWallpaperUITests: [test]
    test:
      targets:
        - BoticonWallpaperUITests
